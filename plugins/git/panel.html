<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{font:13px Arial;background:#292b2e;color:#eee;margin:12px}button{background:#3b4653;color:#eee;border:1px solid #677181;border-radius:4px;padding:6px 10px;margin:3px;cursor:pointer}input{background:#202123;color:#eee;border:1px solid #666;padding:7px;width:94%}small{color:#aaa}</style><h3>Локальный Git</h3><p><button onclick="go('status')">Статус</button><button onclick="go('diff')">Изменения</button><button onclick="go('log')">История</button><button onclick="go('branches')">Ветки</button><button onclick="go('fetch')">Fetch</button><button onclick="go('add')">Добавить все</button></p><input id="message" placeholder="Сообщение коммита"><button onclick="go('commit:'+document.getElementById('message').value)">Создать коммит</button><p><small>Результат команды показан ниже.</small></p><script>function go(command){location.href='panel.html?command='+encodeURIComponent(command)}</script></html>
